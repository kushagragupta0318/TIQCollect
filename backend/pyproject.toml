[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tiqcollect-backend"
version = "1.0.0"
description = "TIQCollect Enterprise Collections Management System — Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "redis==5.2.1",
    "celery==5.4.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.19",
    "minio==7.2.11",
    "httpx==0.28.1",
    "faker==33.1.0",
    "pandas==2.2.3",
    "numpy==2.2.0",
    "scikit-learn==1.6.0",
    "xgboost==2.1.3",
    "pyotp==2.9.0",
    "pillow==11.0.0",
    "python-dateutil==2.9.0",
    "geopy==2.4.1",
    "email-validator==2.2.0",
    "slowapi==0.1.9",
    "structlog==24.4.0",
    "orjson==3.10.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
