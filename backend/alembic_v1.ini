# Alembic for a v1 (pre-standalone) database — HISTORY ONLY.
#
#   alembic -c alembic_v1.ini current
#   alembic -c alembic_v1.ini upgrade d0b4e6f8a213
#
# 2026-09-24 (B11, coordinator audit gate 1). The v1 chain (18 revisions,
# head d0b4e6f8a213) moved to alembic/versions_v1/ when the v2 baseline
# replaced it on the default upgrade path. A database built from v1 — the
# owner's demo database among them — still carries a v1 alembic_version, and
# `alembic` with the default alembic.ini cannot locate that revision any
# more. This file points at the v1 chain so such a database can still be
# inspected or brought to the v1 head. It never migrates v1 to v2: that is
# the data transform (task B15), into a new database.
#
# NOTE: alembic/env.py is shared and imports the v2 models; `upgrade`,
# `current` and `history` use only the revisions' explicit operations, so
# they work. Do NOT run `revision --autogenerate` with this file.

[alembic]
script_location = alembic
version_locations = alembic/versions_v1
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg2://tiqcollect:tiqcollect_pass@localhost:15432/tiqcollect

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
