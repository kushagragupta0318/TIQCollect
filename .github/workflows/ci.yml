name: CI

# The branches work actually happens on. `main` on this remote is an unrelated
# June history, so a trigger on main alone never ran for this repo.
on:
  push:
    branches: [TIQCollect-app, "standalone-*", "lead-*", "hotfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # For tests/test_rate_limit_redis.py (two limiter instances, one Redis).
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app scripts
      # No env block needed: tests/conftest.py supplies the required settings,
      # ignores any backend/.env and blocks network access.
      - name: Test
        env:
          TIQ_REDIS_TEST_URL: redis://localhost:6379/15
        run: python -m pytest -q -p no:cacheprovider

  # 2026-09-28 (B19): what SQLite cannot show — the Alembic chain round trip and
  # model diff, native enums, partitions (incl. B11 MED 8), the analytics
  # materialized views, SET LOCAL timeouts and the read-only analytics session.
  # tests/pg skips everywhere TIQ_PG_TEST_URL is unset (the job above).
  backend-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Postgres suite
        env:
          TIQ_PG_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: python -m pytest tests/pg -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # react-router 8 requires >= 22.22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `npm run build` is `tsc -b && vite build`: the real typecheck plus the
      # production bundle. `tsc --noEmit` against the solution tsconfig checks
      # nothing and always passes.
      - name: Build
        run: npm run build
      # Before Lint so it still runs while lint has errors.
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dev compose file is valid
        run: docker compose config -q
      - name: Production image builds
        run: docker build -t tiq-prod-check:ci .
      # Fails if the image grows past the budget. Lower the budget as
      # RESTRUCTURE-PLAN step 1.7 lands; never raise it silently.
      - name: Image size budget
        run: |
          size=$(docker image inspect tiq-prod-check:ci --format '{{.Size}}')
          budget=3300000000
          echo "image size: $size bytes (budget $budget)"
          test "$size" -le "$budget"
