# ─── CHANGELOG (prototype → product) ───
# New file, 2026-07-21. Lint + typecheck + test on every PR/push to main,
# per final_changes.md §7.3 ("no .github/workflows/ at all" gap). Inert
# until this repo is pushed to GitHub — does not run locally. See
# changelog.md for full context.
name: CI

on:
  pull_request:
  push:
    branches: [main, TIQCollect-app]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Settings with no default in core/config.py stop the app importing, so pytest
    # failed at collection until these were supplied. All values are fake. The
    # contact window is the code default (a demo .env's 0/24 fails six tests), and
    # every provider credential is empty, so no test can reach Twilio, Razorpay,
    # an LLM or Whisper.
    env:
      SECRET_KEY: ci-test-secret-key-not-real-0123456789abcdef
      DATABASE_URL: postgresql+psycopg2://nobody:nothing@127.0.0.1:1/none
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test-secret
      COMMAND_CENTRE_API_KEY: test
      CONTACT_HOUR_START: "8"
      CONTACT_HOUR_END: "19"
      LLM_PROVIDER: none
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      GOOGLE_MAPS_API_KEY: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""
      TWILIO_WHATSAPP_FROM: ""
      TWILIO_API_KEY_SID: ""
      TWILIO_API_KEY_SECRET: ""
      TWILIO_TWIML_APP_SID: ""
      RAZORPAY_TEST_API: ""
      RAZORPAY_TEST_KEY_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12, matching pyproject.toml's `requires-python = ">=3.12"`. This
          # was pinned to 3.11, so the job could only ever fail — it installed
          # an interpreter the package declares it does not support. Corrected
          # 2026-09-06.
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall app
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      # `tsc -b`, not `tsc --noEmit`. The root tsconfig.json is a SOLUTION file:
      # it lists project references and no files of its own, so `tsc --noEmit`
      # resolved nothing and passed unconditionally. It reported success while
      # `npm run build` was failing on a type error in RecordVisitPage.tsx —
      # a step that cannot fail is worse than no step, because it is read as
      # evidence. `-b` builds the referenced projects, which is what the build
      # itself runs. Corrected 2026-09-06.
      - name: Typecheck
        run: npx tsc -b
      # Added 2026-09-14. The frontend gained vitest on 2026-09-09 and had 44
      # tests by 2026-09-11, none of which CI had ever run — the allocation
      # explanation arithmetic, the reassignment dialog rules, the compliance
      # chip logic all passed only on whichever laptop last ran `npm test`.
      # Before Lint on purpose: lint has failed on 7 pre-existing
      # set-state-in-effect errors since 2026-09-06 (CLAUDE.md issue 1), and a
      # step placed after it would never execute.
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
