# Field Ops (TIQCollect) — LOCAL DEVELOPMENT stack.
#
#     docker compose up -d --build
#
# Then open http://localhost:5473. Edit anything under frontend/src and the
# browser updates on save; edit anything under backend/app and uvicorn reloads.
# Neither needs a rebuild — the source directories are bind-mounted, not copied.
#
#     http://localhost:5473   the app (Vite dev server, hot module reload)
#     http://localhost:8400   the API on its own, and /docs
#     http://localhost:19001  MinIO console
#     localhost:15432         Postgres    localhost:16379  Redis
#
# The database is created and filled automatically on first start. The demo
# accounts are listed once, in backend/fixtures/README.md — never here and never
# in the UI (the login page's demo buttons were removed on 2026-09-24).
#
# This is NOT how the app is deployed. In production one container serves the
# built SPA and the API on a single origin — see ../docker-compose.yml and
# ../DEPLOYMENT.md. Here they are two containers so each can hot-reload, and the
# browser only ever talks to Vite, which proxies /api and /ws through to the
# backend. That keeps requests same-origin, so CORS never enters into it.
#
# Every value below has a working default: a fresh clone runs with no .env at
# all. Copy .env.example to .env to override any of them, or backend/.env.example
# to backend/.env to add API keys (OpenAI, Twilio, Razorpay…).
#
# Ports are in a 1xxxx block and 5473/8400 so this cannot collide with anything
# you already run.

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: fieldops_dev_postgres
    restart: unless-stopped
    environment:
      # This and the database named in DATABASE_URL below have to agree —
      # Postgres only ever creates the one named here.
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldops_dev_pass}
    volumes:
      - pgdata16:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fieldops}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── Redis (OTP store + Celery broker) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fieldops_dev_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── OSRM (road routing over OpenStreetMap) ───────────────────────────────
  # OPT-IN. Start it with:  docker compose --profile routing up -d
  #
  # WHY IT IS HERE. settings.OSRM_BASE_URL defaults to router.project-osrm.org,
  # the PUBLIC DEMO SERVER: rate-limited, no SLA, and its usage policy rules out
  # production traffic. The nightly planner fires one (stops+1)^2 table call per
  # agent against it at 20:00, and core/routing falls back to straight-line
  # Haversine whenever it is refused — which is how every beat ETA came to be
  # crow-flies without anyone noticing.
  #
  # WHY IT IS OPT-IN RATHER THAN DEFAULT. It needs a map extract that is not in
  # this repo and is far too large to be. One-time preparation, roughly 1.5 GB
  # of download and 10-20 minutes of CPU for the NCR region:
  #
  #   mkdir -p osrm-data && cd osrm-data
  #   curl -O https://download.geofabrik.de/asia/india/northern-zone-latest.osm.pbf
  #   docker run --rm -v "$PWD:/data" ghcr.io/project-osrm/osrm-backend   #     osrm-extract -p /opt/car.lua /data/northern-zone-latest.osm.pbf
  #   docker run --rm -v "$PWD:/data" ghcr.io/project-osrm/osrm-backend   #     osrm-partition /data/northern-zone-latest.osrm
  #   docker run --rm -v "$PWD:/data" ghcr.io/project-osrm/osrm-backend   #     osrm-customize /data/northern-zone-latest.osrm
  #
  # Then set OSRM_BASE_URL=http://osrm:5000 in backend/.env and restart the api
  # and celery_worker. Nothing in the code changes — that seam already exists.
  #
  # Until then the product runs exactly as before, and every route it produces
  # records route_source="haversine" so the degradation is visible rather than
  # assumed.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: fieldops_dev_osrm
    profiles: ["routing"]
    restart: unless-stopped
    command: >
      osrm-routed --algorithm mld --max-table-size 8000
      /data/${OSRM_EXTRACT:-northern-zone-latest}.osrm
    volumes:
      - ./osrm-data:/data:ro
    ports:
      - "${OSRM_HOST_PORT:-15000}:5000"
    healthcheck:
      # A real query rather than a port check: osrm-routed accepts connections
      # before the graph is loaded, so a port check reports healthy while every
      # request still fails.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:5000/route/v1/driving/77.0266,28.4595;77.03,28.47' | grep -q '\"code\":\"Ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ─── MinIO (visit photos, signatures, recordings) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fieldops_dev_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fieldops_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fieldops_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      # mc ready, not curl: recent MinIO images ship no curl, and a check that
      # can never pass leaves everything waiting on it stuck in "starting".
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── API (hot reload) ─────────────────────────────────────────────────────
  api: &app
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: fieldops-dev:latest
    container_name: fieldops_dev_api
    restart: unless-stopped
    # Optional. Supply backend/.env to add API keys; the defaults below are
    # enough to run without it.
    env_file:
      - path: ./backend/.env
        required: false
    environment: &app-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD:-fieldops_dev_pass}@postgres:5432/${POSTGRES_DB:-fieldops}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      # No defaults in core/config.py — the app refuses to start without them.
      SECRET_KEY: ${SECRET_KEY:-dev_only_secret_change_me_openssl_rand_hex_32}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-fieldops_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-fieldops_minio_secret}
      # Pre-signed upload URLs carry this host in the signature, so it has to be
      # one the BROWSER can reach — minio:9000 only resolves inside the compose
      # network. Set explicitly because backend/.env may still point at the
      # deployed media host, which would send your local uploads to the server.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:19000}
      MINIO_PUBLIC_SECURE: "false"
      # Without this the 100m geo-fence blocks every visit unless you are
      # physically at a seeded Gurugram address. DEMO_MODE re-anchors the demo
      # customers to the agent's live GPS on check-in.
      DEMO_MODE: ${DEMO_MODE:-true}
      # The public origin Twilio calls (scheme + host). The voice webhook
      # checks X-Twilio-Signature against it and refuses every call while it
      # is empty — which is the right answer on a laptop Twilio cannot reach.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Two security controls, relaxed for THIS local demo stack only and by
      # name (they used to ride on DEMO_MODE). Both default false in
      # core/config.py, so a deployment gets them only by setting them.
      #   DEMO_DEVICE_REBIND: the simulator and a laptop browser log in as the
      #     same agent; a new device re-binds (audited) instead of 403.
      #     Defaults to DEMO_MODE: the API refuses to start with it on and
      #     DEMO_MODE off, because it switches device binding off.
      #   DEMO_OTP_ECHO: with no SMS transport configured, the borrower's OTP
      #     is shown to the agent so a payment can be verified in a demo.
      DEMO_DEVICE_REBIND: ${DEMO_DEVICE_REBIND:-${DEMO_MODE:-true}}
      DEMO_OTP_ECHO: ${DEMO_OTP_ECHO:-true}
      # Believe X-Forwarded-For only from loopback. The Vite proxy passes a
      # browser's header through, and :5473/:8400 listen on every interface,
      # so trusting the compose network would let a LAN device pick its own
      # rate-limit bucket.
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      # Pairs with the web's VITE_DEMO_UPI_AUTOCONFIRM below (hotfix PAY-1
      # round 3, 2026-09-24): the demo auto-confirm records a DEMO-UPI-
      # reference, and the server accepts one only with this flag. DEMO_MODE
      # does not admit it. DEV ONLY: docker-compose.prod.yml never sets it, and it defaults to false in config.py.
      DEMO_UPI_ACCEPT: "true"
      # RBI contact hours are enforced with a real 403. Left open so the app
      # works outside 08:00-19:00 IST; set 8 and 19 for true behaviour.
      CONTACT_HOUR_START: ${CONTACT_HOUR_START:-0}
      CONTACT_HOUR_END: ${CONTACT_HOUR_END:-24}
      # Speech-to-text. Defaults to "local" (self-hosted faster-whisper, free,
      # no key) rather than config.py's "openai", because the hosted path needs
      # OPENAI_API_KEY and returns 503 without one — which is what every voice
      # note hit here. Set to "openai" once a key with audio-model access is
      # configured. This anchor is shared with celery_worker, which is where
      # the async /visits/{id}/transcribe job actually runs.
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-local}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      # Avoid the generic host-level DEBUG variable: developer shells and
      # tooling commonly set it to strings such as "release", which Pydantic
      # correctly rejects for this boolean setting.
      DEBUG: ${FIELDOPS_DEBUG:-true}
      APP_ENV: development
      # The browser only ever talks to Vite, which proxies /api server-side, so
      # requests are same-origin and this is only needed if you call :8400
      # directly.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5473,http://localhost:8400}
      RUN_SEED: "false"
    volumes:
      # The whole point: edits on the host are what the reloader sees.
      - ./backend:/app
      # Anonymous volume so host __pycache__ never shadows the container's.
      - /app/__pycache__
      # faster-whisper downloads its model (~464MB for "small") on first use.
      # On the container filesystem that download is repeated after every
      # rebuild or recreate — a 70s stall on the next voice note — and
      # celery_worker, being a separate container, would fetch its own second
      # copy. A shared named volume makes it one download for all three.
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8400}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ─── Frontend (Vite dev server, hot module reload) ────────────────────────
  web:
    image: node:22-alpine
    container_name: fieldops_dev_web
    restart: unless-stopped
    working_dir: /app
    environment:
      # Vite proxies /api and /ws to this. Inside the network the backend is
      # api:8000; the config's default of localhost:8400 would resolve to this
      # container.
      VITE_API_TARGET: http://api:8000
      # Poll for file changes: events do not cross the Windows bind mount, and
      # without this the dev server keeps serving code from before the edit
      # until the container restarts (vite.config.ts, 2026-09-24).
      VITE_WATCH_POLLING: "1"
      # Demo aid (hotfix PAY-1, 2026-09-24): 10 s after the UPI QR is shown the
      # card flips to "payment marked received" and records a DEMO-UPI-
      # reference. DEV ONLY — the prod Dockerfile never sets this, and a
      # frontend test fails if it does. The QR itself appears only when the api
      # has UPI_VPA / UPI_PAYEE_NAME set (no default).
      VITE_DEMO_UPI_AUTOCONFIRM: "1"
    volumes:
      - ./frontend:/app
      # Named volume so the container's node_modules (built for Alpine) is not
      # replaced by whatever the host has — a host install carries binaries for
      # the host's libc and rollup/esbuild will fail to load.
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_HOST_PORT:-5473}:5473"
    # Installs on start, and restarts itself when package-lock.json changes
    # (frontend/scripts/dev-web.sh), so a merged dependency needs no manual step.
    command: sh scripts/dev-web.sh
    depends_on:
      api:
        condition: service_started

  # ─── Celery worker + beat ─────────────────────────────────────────────────
  # Same image and environment as the API; neither seeds. --reload is not passed
  # here because Celery has no equivalent; restart them after changing a task.
  celery_worker:
    <<: *app
    container_name: fieldops_dev_celery_worker
    ports: []
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    <<: *app
    container_name: fieldops_dev_celery_beat
    ports: []
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    # -s writes the schedule database to /tmp rather than the working directory,
    # which is bind-mounted — otherwise beat drops a celerybeat-schedule file
    # into your source tree on every run.
    command: celery -A app.workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

  # ─── One-shot: schema + demo data ─────────────────────────────────────────
  # Since 2026-09-22 the entrypoint fills an empty database from the committed
  # backend/fixtures/fieldops-demo-v2.dump (the v2 demo book) and only falls back
  # to scripts/seed_data.py when the fixture is absent or SEED_FROM_FIXTURE=false.
  # Separate from the API because the seed is destructive — it drops every table
  # and every enum in the public schema, then rebuilds. The entrypoint runs
  # either only when the database is empty, so this is a no-op on every start
  # after the first, and the API waits for it to exit 0 rather than briefly
  # serving an empty database.
  #
  # Note that re-running THIS service will not reseed a populated database —
  # the same emptiness gate applies, and it will just print "already seeded".
  # To force a reseed:  docker compose exec api python -m scripts.seed_data
  seed:
    <<: *app
    container_name: fieldops_dev_seed
    restart: "no"
    ports: []
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_SEED: "true"
    command: ["true"]

volumes:
  # Named pgdata16, not postgres_data: an older revision of this file ran
  # postgres:15-alpine, and a v15 data directory makes the v16 server refuse to
  # start. A distinct name gives a clean initialisation without destroying the
  # old volume. Reclaim it with:  docker volume rm field-ops-stub_postgres_data
  pgdata16:
  redis_data:
  minio_data:
  web_node_modules:
  # Whisper model cache, shared by api / celery_worker / celery_beat.
  whisper_cache:
