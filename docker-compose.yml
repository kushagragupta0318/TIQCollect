version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tiqcollect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiqcollect}
      POSTGRES_USER: ${POSTGRES_USER:-tiqcollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiqcollect_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host ports are shifted into a 1xxxx block so they cannot clash with a
    # Postgres/Redis/MinIO you already run locally. Container-internal ports are
    # unchanged, so the service-to-service URLs below (postgres:5432, redis:6379,
    # minio:9000) still work as-is.
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tiqcollect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tiqcollect_redis
    restart: unless-stopped
    command: redis-server --requirepass tiqcollect_redis_pass --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tiqcollect_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (document storage) ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: tiqcollect_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tiqcollect_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tiqcollect_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "19000:9000"   # API
      - "19001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiqcollect_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tiqcollect}:${POSTGRES_PASSWORD:-tiqcollect_pass}@postgres:5432/${POSTGRES_DB:-tiqcollect}
      REDIS_URL: redis://:tiqcollect_redis_pass@redis:6379/0
      CELERY_BROKER_URL: redis://:tiqcollect_redis_pass@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:tiqcollect_redis_pass@redis:6379/2
      MINIO_ENDPOINT: minio:9000
    # Published on 8400, not 8000: inside the collections platform 8000 belongs
    # to Command Center. The container still listens on 8000 internally.
    ports:
      - "8400:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ─── Celery Worker ────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiqcollect_celery_worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tiqcollect}:${POSTGRES_PASSWORD:-tiqcollect_pass}@postgres:5432/${POSTGRES_DB:-tiqcollect}
      REDIS_URL: redis://:tiqcollect_redis_pass@redis:6379/0
      CELERY_BROKER_URL: redis://:tiqcollect_redis_pass@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:tiqcollect_redis_pass@redis:6379/2
    depends_on:
      - api
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ─── Celery Beat (scheduler) ──────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiqcollect_celery_beat
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tiqcollect}:${POSTGRES_PASSWORD:-tiqcollect_pass}@postgres:5432/${POSTGRES_DB:-tiqcollect}
      CELERY_BROKER_URL: redis://:tiqcollect_redis_pass@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:tiqcollect_redis_pass@redis:6379/2
    depends_on:
      - celery_worker
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  minio_data:
